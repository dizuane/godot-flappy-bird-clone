name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          export-templates: true

      - name: Export Linux
        run: |
          mkdir -p build/flappy-bird-clone
          godot --headless --export-release "Linux" \
            build/flappy-bird-clone/flappy-bird-clone.x86_64

      - name: Make executable
        run: |
          chmod +x build/flappy-bird-clone/flappy-bird-clone.x86_64
          chmod +x build/flappy-bird-clone/flappy-bird-clone.sh

      - name: Create ZIP
        run: |
          cd build
          zip -r flappy-bird-clone-linux-x86_64.zip flappy-bird-clone

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            build/flappy-bird-clone-linux-x86_64.zip \
            --title "Flappy Bird Clone ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
